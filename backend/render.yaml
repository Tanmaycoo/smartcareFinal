services:
  # FastAPI Web Service on Render
  - type: web
    name: smartcare-backend
    env: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartcare-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"

databases:
  # Managed PostgreSQL Database on Render
  - name: smartcare-db
    databaseName: smartcare
    user: smartcare_user
    plan: free
    region: oregon
